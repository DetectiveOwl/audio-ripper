<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Ripper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="rack" id="rack">
  <span class="screw tl"></span><span class="screw tr"></span>
  <span class="screw bl"></span><span class="screw br"></span>

  <header>
    <h1>Audio<span class="amp">▸</span>Ripper</h1>
    <div class="head-right">
      <span class="model">MOD. AR-320</span>
      <div class="winctl">
        <button type="button" id="win-min" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 12 12"><path d="M2 9h8"/></svg>
        </button>
        <button type="button" id="win-close" class="close" title="Close" aria-label="Close">
          <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="display">
    <div class="eq" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="readout" id="readout" aria-live="polite">READY. ENTER A URL.</div>
  </div>

  <div class="row">
    <label class="field">
      <small>Source: YouTube / SoundCloud / Spotify (one or more links)</small>
      <input type="text" id="url" placeholder="https://…" autocomplete="off" spellcheck="false">
    </label>
  </div>

  <div class="row">
    <div class="field">
      <small>Destination folder</small>
      <div class="dest">
        <span id="outdir" class="path" title="">…</span>
        <button type="button" id="pick" class="ghost">Change</button>
      </div>
    </div>
  </div>

  <div class="row opts">
    <label class="field half">
      <small>File names</small>
      <select id="name-style">
        <option value="title">Title</option>
        <option value="artist_title">Artist - Title</option>
      </select>
    </label>
    <label class="field half" title="Needed for age-restricted or members-only videos. Firefox works best; Chrome and Edge can be blocked while they are open.">
      <small>Login cookies</small>
      <select id="cookies">
        <option value="none">None</option>
        <option value="firefox">From Firefox</option>
        <option value="chrome">From Chrome</option>
        <option value="edge">From Edge</option>
        <option value="brave">From Brave</option>
        <option value="safari" id="opt-safari">From Safari</option>
        <option value="file">cookies.txt file…</option>
      </select>
    </label>
  </div>

  <div class="row">
    <div class="fmt" role="radiogroup" aria-label="Format">
      <button type="button" id="fmt-mp3" class="on" role="radio" aria-checked="true" data-fmt="mp3"><span class="led"></span>MP3 320</button>
      <button type="button" id="fmt-wav" role="radio" aria-checked="false" data-fmt="wav"><span class="led"></span>WAV</button>
    </div>
    <button class="go" id="go">Extract audio</button>
  </div>

  <div class="progress">
    <div class="bar"><i id="fill"></i></div>
    <div class="pct"><span id="msg">Waiting.</span><b id="pct">0%</b></div>
  </div>

  <section class="queue" id="queue" aria-label="Queue" hidden>
    <div class="qhead">
      <small id="qcount">Queue</small>
      <button type="button" id="qclear" class="link">Clear finished</button>
    </div>
    <ul id="qlist"></ul>
  </section>

  <footer>
    <div class="tools"><span id="tools" aria-live="polite">Components: bundled versions.</span>
      <button type="button" id="check" class="link">Check for updates</button></div>
    <div><b>WAV</b> does not improve an already compressed source: it is only a lossless container.</div>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
