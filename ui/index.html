<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Ripper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="rack" id="rack">
  <span class="screw tl"></span><span class="screw tr"></span>
  <span class="screw bl"></span><span class="screw br"></span>

  <header>
    <h1>Audio<span class="amp">▸</span>Ripper</h1>
    <div class="head-right">
      <span class="model">MOD. AR-320</span>
      <div class="winctl">
        <button type="button" id="win-min" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 12 12"><path d="M2 9h8"/></svg>
        </button>
        <button type="button" id="win-close" class="close" title="Close" aria-label="Close">
          <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="display">
    <div class="eq" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="readout" id="readout">READY. ENTER A URL.</div>
  </div>

  <div class="row">
    <label class="field">
      <small>Source: YouTube / SoundCloud / Spotify</small>
      <input type="url" id="url" placeholder="https://…" autocomplete="off" spellcheck="false">
    </label>
  </div>

  <div class="row">
    <div class="field">
      <small>Destination folder</small>
      <div class="dest">
        <span id="outdir" class="path" title="">…</span>
        <button type="button" id="pick" class="ghost">Change</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="fmt" role="radiogroup" aria-label="Format">
      <button type="button" id="fmt-mp3" class="on" data-fmt="mp3"><span class="led"></span>MP3 320</button>
      <button type="button" id="fmt-wav" data-fmt="wav"><span class="led"></span>WAV</button>
    </div>
    <button class="go" id="go">Extract audio</button>
  </div>

  <div class="progress">
    <div class="bar"><i id="fill"></i></div>
    <div class="pct"><span id="msg">Waiting.</span><b id="pct">0%</b></div>
  </div>

  <button class="dl" id="dl" type="button">Show in folder</button>

  <footer>
    <b>WAV</b> does not improve an already compressed source: it is only a
    lossless container.
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
