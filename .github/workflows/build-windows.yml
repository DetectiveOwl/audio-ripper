name: Build Windows

# Builds the installer and the portable version. Run it by hand (Actions ->
# Build Windows -> Run workflow); the Release workflow also calls it.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download yt-dlp, ffmpeg, spotDL and deno
        shell: pwsh
        run: ./scripts/fetch-binaries.ps1

      - name: Build (NSIS installer)
        run: npx --yes @tauri-apps/cli@2 build

      - name: Name the installer
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1 |
            Copy-Item -Destination AudioRipper-Windows-setup.exe

      - name: Portable version (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable/AudioRipper | Out-Null
          foreach ($f in 'audio-ripper','yt-dlp','ffmpeg','spotdl','deno') {
            Copy-Item "target/release/$f.exe" portable/AudioRipper/
          }
          Compress-Archive -Path portable/AudioRipper -DestinationPath AudioRipper-Windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AudioRipper-installer
          path: AudioRipper-Windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AudioRipper-portable
          path: AudioRipper-Windows-portable.zip
