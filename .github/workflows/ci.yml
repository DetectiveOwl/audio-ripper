name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Core tests and Windows check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ripper-core
      - name: The core's Windows code compiles
        run: cargo check -p ripper-core --target x86_64-pc-windows-msvc
      - name: The core's macOS code compiles
        run: cargo check -p ripper-core --target aarch64-apple-darwin
