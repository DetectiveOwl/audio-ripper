[package]
name = "audio-ripper"
version = "0.1.0"
edition = "2021"
description = "Audio Ripper: estrattore audio per Windows (YouTube, SoundCloud, Spotify) in MP3 320k o WAV."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ripper-core = { path = "../crates/ripper-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
